<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LL(1) Parser & Grammar Analyzer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1, h2, h3, h4 {
      margin-top: 0;
      color: #ffffff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    textarea {
      width: 100%;
      height: 120px;
      background: #090d16;
      color: #38bdf8;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
    }

    pre {
      background: #090d16;
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: monospace;
      color: #a7f3d0;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>LL(1) Grammar Analyzer & Parser</h1>

    <!-- Grammar Input Module -->
    <div class="card">
      <h2>1. Grammar Input</h2>
      <p style="color: #94a3b8; font-size: 14px;">Enter your Context-Free Grammar below (e.g., E -> E + T | T):</p>
      <textarea id="grammarInput">E -> E + T | T
T -> T * F | F
F -> ( E ) | id</textarea>
      <br />
      <button id="btnEliminateLR">Eliminate Left Recursion</button>
    </div>

    <!-- Left Recursion Output Module -->
    <div class="card">
      <h2>2. Step-by-Step Refined Grammar</h2>
      <pre id="refinedGrammarOutput">Click "Eliminate Left Recursion" above to view transformation steps...</pre>
    </div>

    <!-- FIRST / FOLLOW Sets Module -->
    <div class="card">
      <h2>3. FIRST & FOLLOW Sets</h2>
      <div id="firstFollowContainer"></div>
    </div>

    <!-- LL(1) Parsing Table Module -->
    <div class="card">
      <h2>4. LL(1) Parsing Table & Conflict Analysis</h2>
      <div id="ll1TableContainer"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
